<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Зикры — Второй учитель</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f2f7;color:#151515;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;align-items:center;padding:12px 16px;background:#fff;border-bottom:1px solid #e5e5ea;position:sticky;top:0}
.back{display:grid;place-items:center;width:44px;height:44px;border-radius:10px;background:#eaf3ff;color:#007aff;text-decoration:none;font-size:27px}
h1{flex:1;text-align:center;font-size:20px;margin:0} .spacer{width:44px}
main{max-width:680px;margin:auto;padding:18px 14px 36px}
h2{font-size:14px;color:#666;font-weight:600;margin:0 4px 10px}
.card{background:#fff;border-radius:18px;padding:20px 16px;margin-bottom:23px}
.arabic{font-family:"SF Arabic","Geeza Pro","Noto Naskh Arabic",serif;direction:rtl;text-align:right;font-size:29px;line-height:2.05}
.recite{display:block;width:100%;border:0;border-radius:12px;background:transparent;color:inherit;cursor:pointer;padding:6px;text-align:right}
.recite:active,.recite.playing{background:#eaf3ff}
.recite:focus-visible{outline:2px solid #007aff}
.action{display:flex;justify-content:flex-end;align-items:center;gap:9px;color:#007aff;font-size:13px;direction:ltr}
.circle{display:grid;place-items:center;border-radius:50%;width:29px;height:29px;background:#eaf3ff}
.error{display:none;color:#b3261e;font-size:13px}.error.show{display:block}
@media(max-width:380px){.arabic{font-size:26px}}
.dhikr-image{display:block;width:auto;max-width:100%;height:auto;margin:0 0 16px auto}
</style>
</head>
<body>
<header><a class="back" href="../index.html" aria-label="На главную">‹</a><h1>Зикры</h1><span class="spacer"></span></header>
<main>
<h2>Исти‘аза</h2>
<section class="card">
<button class="recite" id="recite" type="button" aria-label="Воспроизвести зикр" aria-controls="audio">
<img class="dhikr-image" src="../assets/images/dhikr/istiadhah.svg" width="323" height="112" alt="Истиаза">
<span class="action"><span id="state">Нажмите, чтобы прослушать</span><span class="circle" id="icon">▶</span></span>
</button>
<audio id="audio" src="../assets/audio/dhikr/istiadhah.mp3?v=20261027-1" preload="none"></audio>
<p class="error" id="error" role="status">Запись не воспроизводится.</p>
</section>
<h2>Аль-Хашр, аят 22</h2><section class="card"><img class="dhikr-image" src="../assets/images/dhikr/al-hashr-22.svg" width="368" height="161" alt="Аль-Хашр, аят 22"></section>
<h2>Аль-Хашр, аят 23</h2><section class="card"><img class="dhikr-image" src="../assets/images/dhikr/al-hashr-23.svg" width="365" height="209" alt="Аль-Хашр, аят 23"></section>
<h2>Аль-Хашр, аят 24</h2><section class="card"><img class="dhikr-image" src="../assets/images/dhikr/al-hashr-24.svg" width="375" height="199" alt="Аль-Хашр, аят 24"></section>
</main>
<script>
const button=document.getElementById("recite"),audio=document.getElementById("audio");
const state=document.getElementById("state"),icon=document.getElementById("icon"),error=document.getElementById("error");
function display(playing){button.classList.toggle("playing",playing);button.setAttribute("aria-label",playing?"Пауза":"Воспроизвести зикр");state.textContent=playing?"Воспроизводится":"Нажмите, чтобы прослушать";icon.textContent=playing?"Ⅱ":"▶"}
let playRequest=0;
button.addEventListener("click",async()=>{
    const request=++playRequest;
    error.classList.remove("show");
    if(!audio.paused&&!audio.error){audio.pause();return}
    try{
        // Повторная попытка после ошибки загрузки, например после восстановления сети.
        if(audio.error) audio.load();
        if(audio.ended) audio.currentTime=0;
        // Safari требует вызова play() непосредственно из нажатия пользователя.
        await audio.play();
    }catch(e){
        // Быстрая пауза отменяет ожидающий play(); это не ошибка записи.
        if(request!==playRequest||e.name==="AbortError") return;
        display(false);
        error.classList.add("show");
    }
});
audio.addEventListener("playing",()=>display(true));
audio.addEventListener("pause",()=>display(false));
audio.addEventListener("ended",()=>display(false));
audio.addEventListener("error",()=>{if(audio.error){display(false);error.classList.add("show")}});
</script>
<script src="../js/dhikr-cache.js?v=20261027-1"></script>
</body>
</html>
