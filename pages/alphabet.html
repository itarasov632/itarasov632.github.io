<!DOCTYPE html>
<html lang="ru" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- PWA мета-теги -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Арабский алфавит">
    <meta name="theme-color" content="#007aff">
    
    <!-- Иконки -->
    <link rel="apple-touch-icon" href="../assets/icons/icon-192.png">
    <link rel="icon" type="image/png" href="../assets/icons/icon-192.png">
    <link rel="manifest" href="../manifest.json">
    
    <!-- Стили -->
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/pages/alphabet.css">
    <link rel="stylesheet" href="../css/responsive.css">
    
    <title>Арабский алфавит</title>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-content">
                <a href="../index.html" id="backButton" class="btn btn-icon" aria-label="Назад">
                    ←
                </a>
                <h1 class="header-title">Арабский алфавит</h1>
                <div style="width: 44px;"></div> <!-- Для симметрии -->
            </div>
        </header>
        
        <main class="main-content">
            <div class="alphabet-page">
                <div class="progress-container">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="progress-text" id="progressText">
                        Изучено: 0 из 28 букв
                    </div>
                </div>
                
                <div class="letters-container">
                    <div id="lettersGrid" class="letters-grid"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- JavaScript -->
    <script type="module" src="../js/app.js"></script>
    <script type="module" src="../js/pages/alphabet-page.js"></script>
</body>
</html>
