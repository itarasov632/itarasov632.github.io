<!DOCTYPE html>
<html lang="ru" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Арабский алфавит">
    
    <title>Арабский алфавит</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f2f2f7;
            height: 100vh;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        
        .container {
            height: 100%;
            display: flex;
            flex-direction: column;
            background: white;
        }
        
        .header {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 0.5px solid rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
        }
        
        .back-button {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: rgba(0, 122, 255, 0.1);
            color: #007aff;
            text-decoration: none;
            font-size: 20px;
        }
        
        .title {
            font-size: 18px;
            font-weight: 600;
            color: #000;
            text-align: center;
            flex: 1;
            margin: 0 10px;
        }
        
        .letters-grid {
            flex: 1;
            padding: 12px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(7, 1fr);
            gap: 12px;
        }
        
        .letter-cell {
            background: white;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'SF Pro Arabic', 'Scheherazade', serif;
            font-size: 42px;
            color: #000;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.05);
            cursor: pointer;
            transition: all 0.15s;
        }
        
        .letter-cell:active {
            background: #f2f2f7;
            transform: scale(0.96);
        }
        
        @media (max-width: 375px) {
            .letter-cell {
                font-size: 38px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="../index.html" class="back-button">‹</a>
            <h1 class="title">Арабский алфавит</h1>
            <div style="width: 44px;"></div>
        </div>
        
        <div class="letters-grid" id="lettersGrid">
            <!-- Буквы загрузятся через JS -->
        </div>
    </div>

    <script>
        const arabicAlphabet = [
            { id: 4, letter: "ث", name: "Са" },
            { id: 3, letter: "ت", name: "Та" },
            { id: 2, letter: "ب", name: "Ба" },
            { id: 1, letter: "ا", name: "Алиф" },
            { id: 8, letter: "د", name: "Даль" },
            { id: 7, letter: "خ", name: "Ха" },
            { id: 6, letter: "ح", name: "Ха" },
            { id: 5, letter: "ج", name: "Джим" },
            { id: 12, letter: "س", name: "Син" },
            { id: 11, letter: "ز", name: "За" },
            { id: 10, letter: "ر", name: "Ра" },
            { id: 9, letter: "ذ", name: "Заль" },
            { id: 16, letter: "ط", name: "Та" },
            { id: 15, letter: "ض", name: "Дад" },
            { id: 14, letter: "ص", name: "Сад" },
            { id: 13, letter: "ش", name: "Шин" },
            { id: 20, letter: "ف", name: "Фа" },
            { id: 19, letter: "غ", name: "Гайн" },
            { id: 18, letter: "ع", name: "Айн" },
            { id: 17, letter: "ظ", name: "За" },
            { id: 24, letter: "م", name: "Мим" },
            { id: 23, letter: "ل", name: "Лям" },
            { id: 22, letter: "ك", name: "Каф" },
            { id: 21, letter: "ق", name: "Каф" },
            { id: 28, letter: "ي", name: "Йа" },
            { id: 27, letter: "و", name: "Вав" },
            { id: 26, letter: "ه", name: "Ха" },
            { id: 25, letter: "ن", name: "Нун" }

        ];

        document.addEventListener('DOMContentLoaded', function() {
            const grid = document.getElementById('lettersGrid');
            
            arabicAlphabet.forEach(letter => {
                const cell = document.createElement('div');
                cell.className = 'letter-cell';
                cell.textContent = letter.letter;
                cell.title = letter.name;
                
                cell.addEventListener('click', () => {
                    window.location.href = `letter.html?id=${letter.id}`;
                });
                
                grid.appendChild(cell);
            });
        });
    </script>
</body>
</html>
