<!DOCTYPE html>
<html lang="ru" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Сура</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f2f2f7;
            height: 100vh;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        
        .container {
            height: 100%;
            display: flex;
            flex-direction: column;
            background: white;
        }
        
        .header {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 0.5px solid rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }
        
        .back-button {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: rgba(0, 122, 255, 0.1);
            color: #007aff;
            text-decoration: none;
            font-size: 20px;
        }
        
        .back-button:active {
            background: rgba(0, 122, 255, 0.2);
            transform: scale(0.92);
        }
        
        .header-content {
            flex: 1;
            margin: 0 10px;
        }
        
        .surah-arabic-name {
            font-family: 'SF Pro Arabic', 'Scheherazade', serif;
            font-size: 24px;
            color: #000;
            direction: rtl;
            text-align: center;
            margin-bottom: 2px;
            cursor: pointer;
            user-select: none;
            transition: opacity 0.2s, text-shadow 0.2s;
        }
        
        .surah-arabic-name.playing-surah {
            opacity: 0.7;
            text-shadow: 0 0 4px rgba(0, 122, 255, 0.5);
            animation: gentlePulse 1s ease-in-out infinite;
        }
        
        @keyframes gentlePulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; text-shadow: 0 0 8px rgba(0, 122, 255, 0.8); }
        }
        
        .surah-arabic-name:active {
            transform: scale(0.98);
        }
        
        .surah-info {
            font-size: 14px;
            color: #666;
            text-align: center;
        }
        
        .surah-content {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 16px 8px;
        }
        
        .basmala-container {
            margin-bottom: 16px;
            display: flex;
            justify-content: flex-end;
            width: 100%;
        }
        
        .ayahs-container {
            width: 100%;
        }
        
        .ayah, .basmala {
            display: flex;
            justify-content: flex-end;
            padding: 0;
            background: transparent;
            border: none;
            margin-bottom: 8px;
            cursor: pointer;
            width: 100%;
        }
        
        .ayah img, .basmala img {
            height: 60px;
            width: auto;
            max-width: 100%;
            display: block;
            border-radius: 12px;
            transition: all 0.15s;
        }
        
        .ayah.playing img, .basmala.playing img {
            background: rgba(0, 122, 255, 0.1);
            border: 1px solid rgba(0, 122, 255, 0.3);
            border-radius: 12px;
        }
        
        .recording-bar {
            display: flex;
            gap: 12px;
            padding: 12px 16px;
            background: white;
            border-top: 0.5px solid rgba(0, 0, 0, 0.1);
            border-bottom: 0.5px solid rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
        }
        
        .record-btn, .playback-btn {
            flex: 1;
            padding: 12px 0;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all 0.15s;
        }
        
        .record-btn {
            background: #007aff;
            color: white;
        }
        
        .record-btn:active {
            background: #0056cc;
            transform: scale(0.97);
        }
        
        .record-btn.recording {
            background: #ff3b30;
        }
        
        .playback-btn {
            background: #f2f2f7;
            color: #007aff;
            border: 1px solid rgba(0, 122, 255, 0.3);
        }
        
        .playback-btn:active {
            background: #e5e5ea;
            transform: scale(0.97);
        }
        
        .playback-btn:disabled {
            opacity: 0.4;
            transform: none;
            pointer-events: none;
        }
        
        .navigation {
            display: flex;
            justify-content: space-between;
            padding: 12px 16px;
            background: white;
            border-top: 0.5px solid rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
        }
        
        .nav-button {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border-radius: 12px;
            background: #f2f2f7;
            color: #000;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
        }
        
        .nav-button:active {
            background: #e5e5ea;
            transform: scale(0.97);
        }
        
        @media (max-width: 375px) {
            .surah-arabic-name { font-size: 22px; }
            .surah-info { font-size: 13px; }
            .ayah img, .basmala img { height: 55px; }
            .record-btn, .playback-btn { padding: 10px 0; font-size: 15px; }
            .nav-button { padding: 8px 14px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="surahs.html" class="back-button">‹</a>
            <div class="header-content" id="headerContent"></div>
            <div style="width: 44px;"></div>
        </div>
        
        <div class="surah-content" id="surahContent"></div>
        
        <div class="recording-bar">
            <button class="record-btn" id="recordButton">🎤 Записать</button>
            <button class="playback-btn" id="playbackButton" disabled>▶ Воспроизвести</button>
        </div>
        
        <div class="navigation">
            <a href="#" class="nav-button" id="prevButton">← Предыдущая</a>
            <a href="surahs.html" class="nav-button">Список</a>
            <a href="#" class="nav-button" id="nextButton">Следующая →</a>
        </div>
    </div>

    <script>
        // ==================== ДАННЫЕ ====================
        const surahsData = {
            1: { id: 1, number: 1, name: "Аль-Фатиха", arabicName: "الْفَاتِحَةِ", ayahCount: 7 },
            67: { id: 67, number: 67, name: "Аль-Мульк", arabicName: "الْمُلْكِ", ayahCount: 30 },
            96: { id: 96, number: 96, name: "Аль-Алак", arabicName: "الْعَلَقِ", ayahCount: 19 },
            97: { id: 97, number: 97, name: "Аль-Кадр", arabicName: "الْقَدْرِ", ayahCount: 5 },
            98: { id: 98, number: 98, name: "Аль-Баййина", arabicName: "الْبَيِّنَةِ", ayahCount: 8 },
            99: { id: 99, number: 99, name: "Аз-Зальзаля", arabicName: "الزَّلْزَلَةِ", ayahCount: 8 },
            100: { id: 100, number: 100, name: "Аль-Адия́т", arabicName: "الْعَادِيَاتِ", ayahCount: 11 },
            101: { id: 101, number: 101, name: "Аль-Кариа", arabicName: "الْقَارِعَةِ", ayahCount: 11 },
            102: { id: 102, number: 102, name: "Ат-Такасур", arabicName: "التَّكَاثُرِ", ayahCount: 8 },
            103: { id: 103, number: 103, name: "Аль-Аср", arabicName: "الْعَصْرِ", ayahCount: 3 },
            104: { id: 104, number: 104, name: "Аль-Хумаза", arabicName: "الْهُمَزَةِ", ayahCount: 9 },
            105: { id: 105, number: 105, name: "Аль-Филь", arabicName: "الْفِيلِ", ayahCount: 5 },
            106: { id: 106, number: 106, name: "Курайш", arabicName: "قُرَيْشٍ", ayahCount: 4 },
            107: { id: 107, number: 107, name: "Аль-Ма'ун", arabicName: "الْمَاعُونَ", ayahCount: 7 },
            108: { id: 108, number: 108, name: "Аль-Каусар", arabicName: "الْكَوْثَرِ", ayahCount: 3 },
            109: { id: 109, number: 109, name: "Аль-Кафирун", arabicName: "الْكَافِرُونَ", ayahCount: 6 },
            110: { id: 110, number: 110, name: "Ан-Наср", arabicName: "النَّصْرِ", ayahCount: 3 },
            111: { id: 111, number: 111, name: "Аль-Масад", arabicName: "الْمَسَدِ", ayahCount: 5 },
            112: { id: 112, number: 112, name: "Аль-Ихлас", arabicName: "الْإِخْلَاصِ", ayahCount: 4 },
            113: { id: 113, number: 113, name: "Аль-Фалак", arabicName: "الْفَلَقِ", ayahCount: 5 },
            114: { id: 114, number: 114, name: "Ан-Нас", arabicName: "النَّاسِ", ayahCount: 6 }
        };

        const navigationOrder = [1, 67, 96, 97, 98, 99, 100, 101, 102, 103, 104, 105, 106, 107, 108, 109, 110, 111, 112, 113, 114];

        // ==================== СОСТОЯНИЕ ====================
        let currentSurahId = 1;
        let currentAudio = null;
        let currentPlayingElement = null;
        
        let fullSurahPlaying = false;
        let fullSurahQueue = [];
        let currentQueueIndex = 0;
        
        let mediaRecorder = null;
        let audioChunks = [];
        let recordedBlob = null;
        let isRecording = false;
        let recordedAudio = null;
        let mediaStream = null;

        // ==================== ЗАГРУЗКА СУРЫ ====================
        function loadSurah(surahId) {
            const surah = surahsData[surahId];
            if (!surah) {
                window.location.href = 'surahs.html';
                return;
            }
            
            stopFullSurah();
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;
            }
            if (currentPlayingElement) {
                currentPlayingElement.classList.remove('playing');
                currentPlayingElement = null;
            }
            
            document.title = `Сура ${surah.number} • ${surah.name}`;
            
            // Хедер
            const headerContent = document.getElementById('headerContent');
            headerContent.innerHTML = `
                <div class="surah-arabic-name" id="surahArabicName">${surah.arabicName}</div>
                <div class="surah-info">Сура ${surah.number} • ${surah.name}</div>
            `;
            document.getElementById('surahArabicName').addEventListener('click', toggleFullSurah);
            
            // Контент
            const content = document.getElementById('surahContent');
            content.innerHTML = '';
            
            // Басмала (кроме суры 9, но у нас её нет)
            const basmalaContainer = document.createElement('div');
            basmalaContainer.className = 'basmala-container';
            basmalaContainer.innerHTML = `
                <div class="basmala" id="basmalaElement">
                    <img src="../assets/images/surahs/${surahId}/basmala.png" alt="Басмала" loading="lazy">
                </div>
            `;
            content.appendChild(basmalaContainer);
            
            // Аяты
            const ayahsContainer = document.createElement('div');
            ayahsContainer.className = 'ayahs-container';
            for (let i = 1; i <= surah.ayahCount; i++) {
                const ayahElement = document.createElement('div');
                ayahElement.className = 'ayah';
                ayahElement.dataset.ayahNumber = i;
                ayahElement.dataset.audioFile = `${surahId}_${i}.mp3`;
                ayahElement.innerHTML = `<img src="../assets/images/surahs/${surahId}/${i}.png" alt="Аят ${i}" loading="lazy">`;
                ayahElement.addEventListener('click', () => playAudio(`${surahId}_${i}.mp3`, ayahElement));
                ayahsContainer.appendChild(ayahElement);
            }
            content.appendChild(ayahsContainer);
            
            // Басмала клик
            document.getElementById('basmalaElement').addEventListener('click', () => playAudio(`${surahId}_basmala.mp3`, document.getElementById('basmalaElement')));
            
            updateNavigation(surahId);
        }

        // ==================== АУДИО ====================
        function playAudio(audioFile, element) {
            if (fullSurahPlaying) stopFullSurah();
            
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
            if (currentPlayingElement) {
                currentPlayingElement.classList.remove('playing');
            }
            
            element.classList.add('playing');
            currentPlayingElement = element;
            
            const audioPath = `../assets/audio/surahs/${audioFile}`;
            currentAudio = new Audio(audioPath);
            currentAudio.play().catch(() => {
                element.classList.remove('playing');
                currentPlayingElement = null;
                if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
            });
            
            currentAudio.onended = () => {
                element.classList.remove('playing');
                currentPlayingElement = null;
                currentAudio = null;
            };
            if (navigator.vibrate) navigator.vibrate(30);
        }

        // ==================== ПАСХАЛКА (ВСЯ СУРА) ====================
        function toggleFullSurah() {
            if (fullSurahPlaying) stopFullSurah();
            else startFullSurah();
        }
        
        function startFullSurah() {
            const surah = surahsData[currentSurahId];
            if (!surah) return;
            
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;
            }
            if (currentPlayingElement) {
                currentPlayingElement.classList.remove('playing');
                currentPlayingElement = null;
            }
            
            fullSurahQueue = [];
            const basmalaElement = document.getElementById('basmalaElement');
            if (basmalaElement) {
                fullSurahQueue.push({ element: basmalaElement, audioFile: `${currentSurahId}_basmala.mp3` });
            }
            
            const ayahs = document.querySelectorAll('.ayah');
            ayahs.forEach((el, idx) => {
                fullSurahQueue.push({ element: el, audioFile: `${currentSurahId}_${idx + 1}.mp3` });
            });
            
            if (fullSurahQueue.length === 0) return;
            
            fullSurahPlaying = true;
            currentQueueIndex = 0;
            document.getElementById('surahArabicName').classList.add('playing-surah');
            playNextInQueue();
        }
        
        function playNextInQueue() {
            if (!fullSurahPlaying || currentQueueIndex >= fullSurahQueue.length) {
                stopFullSurah();
                return;
            }
            
            const item = fullSurahQueue[currentQueueIndex];
            if (currentPlayingElement) currentPlayingElement.classList.remove('playing');
            if (item.element) {
                item.element.classList.add('playing');
                currentPlayingElement = item.element;
            }
            
            const audioPath = `../assets/audio/surahs/${item.audioFile}`;
            currentAudio = new Audio(audioPath);
            currentAudio.play().catch(() => {
                currentQueueIndex++;
                playNextInQueue();
            });
            currentAudio.onended = () => {
                currentQueueIndex++;
                playNextInQueue();
            };
        }
        
        function stopFullSurah() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;
            }
            if (currentPlayingElement) {
                currentPlayingElement.classList.remove('playing');
                currentPlayingElement = null;
            }
            fullSurahPlaying = false;
            fullSurahQueue = [];
            currentQueueIndex = 0;
            document.getElementById('surahArabicName')?.classList.remove('playing-surah');
        }

        // ==================== НАВИГАЦИЯ ====================
        function getPrevSurahId(id) {
            const idx = navigationOrder.indexOf(id);
            return navigationOrder[idx === 0 ? navigationOrder.length - 1 : idx - 1];
        }
        
        function getNextSurahId(id) {
            const idx = navigationOrder.indexOf(id);
            return navigationOrder[idx === navigationOrder.length - 1 ? 0 : idx + 1];
        }
        
        function navigateToSurah(id) {
            if (!surahsData[id]) return;
            stopFullSurah();
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;
            }
            if (currentPlayingElement) {
                currentPlayingElement.classList.remove('playing');
                currentPlayingElement = null;
            }
            currentSurahId = id;
            window.history.pushState({}, '', `?id=${id}`);
            loadSurah(id);
            document.getElementById('surahContent').scrollTop = 0;
        }
        
        function updateNavigation(id) {
            const prevId = getPrevSurahId(id);
            const nextId = getNextSurahId(id);
            const prevBtn = document.getElementById('prevButton');
            const nextBtn = document.getElementById('nextButton');
            
            prevBtn.href = `?id=${prevId}`;
            prevBtn.textContent = `← ${surahsData[prevId]?.number || ''}`;
            nextBtn.href = `?id=${nextId}`;
            nextBtn.textContent = `${surahsData[nextId]?.number || ''} →`;
        }

        // ==================== ЗАПИСЬ ====================
        function setupRecording() {
            const recordBtn = document.getElementById('recordButton');
            const playbackBtn = document.getElementById('playbackButton');
            
            recordBtn.addEventListener('click', async () => {
                if (isRecording) stopRecording();
                else await startRecording();
            });
            
            playbackBtn.addEventListener('click', () => {
                if (!recordedBlob) return;
                if (recordedAudio) {
                    recordedAudio.pause();
                    recordedAudio.currentTime = 0;
                }
                const url = URL.createObjectURL(recordedBlob);
                recordedAudio = new Audio(url);
                recordedAudio.play();
                playbackBtn.textContent = '⏸ Стоп';
                recordedAudio.onended = () => {
                    playbackBtn.textContent = '▶ Воспроизвести';
                    URL.revokeObjectURL(url);
                };
                recordedAudio.onpause = () => {
                    playbackBtn.textContent = '▶ Воспроизвести';
                };
            });
        }
        
        async function startRecording() {
            const recordBtn = document.getElementById('recordButton');
            const playbackBtn = document.getElementById('playbackButton');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaStream = stream;
                let mimeType = '';
                for (const type of ['audio/webm', 'audio/mp4', 'audio/mpeg']) {
                    if (MediaRecorder.isTypeSupported(type)) { mimeType = type; break; }
                }
                mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
                audioChunks = [];
                mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    mediaStream?.getTracks().forEach(t => t.stop());
                    mediaStream = null;
                    recordedBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    playbackBtn.disabled = false;
                    isRecording = false;
                    recordBtn.textContent = '🎤 Записать';
                    recordBtn.classList.remove('recording');
                    if (navigator.vibrate) navigator.vibrate(50);
                };
                mediaRecorder.start();
                isRecording = true;
                recordBtn.textContent = '⏹ Остановить';
                recordBtn.classList.add('recording');
                if (navigator.vibrate) navigator.vibrate(30);
            } catch (error) {
                recordBtn.textContent = '🎤 Ошибка';
                setTimeout(() => { recordBtn.textContent = '🎤 Записать'; }, 2000);
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            }
        }
        
        function stopRecording() {
            if (mediaRecorder && isRecording) mediaRecorder.stop();
        }

        // ==================== ИНИЦИАЛИЗАЦИЯ ====================
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const id = parseInt(params.get('id'));
            if (id && surahsData[id]) currentSurahId = id;
            loadSurah(currentSurahId);
            setupRecording();
            
            document.getElementById('prevButton').addEventListener('click', (e) => {
                e.preventDefault();
                navigateToSurah(getPrevSurahId(currentSurahId));
            });
            document.getElementById('nextButton').addEventListener('click', (e) => {
                e.preventDefault();
                navigateToSurah(getNextSurahId(currentSurahId));
            });
        });
        
        window.addEventListener('popstate', () => {
            const params = new URLSearchParams(window.location.search);
            const id = parseInt(params.get('id'));
            if (id && surahsData[id] && id !== currentSurahId) {
                currentSurahId = id;
                loadSurah(currentSurahId);
                stopFullSurah();
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.currentTime = 0;
                    currentAudio = null;
                }
                if (currentPlayingElement) {
                    currentPlayingElement.classList.remove('playing');
                    currentPlayingElement = null;
                }
            }
        });
    </script>
</body>
</html>
