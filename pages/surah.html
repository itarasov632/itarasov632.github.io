<!DOCTYPE html>
<html lang="ru" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>Сура</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f2f2f7;
            height: 100vh;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        
        .container {
            height: 100%;
            display: flex;
            flex-direction: column;
            background: white;
        }
        
        .header {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 0.5px solid rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }
        
        .back-button {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: rgba(0, 122, 255, 0.1);
            color: #007aff;
            text-decoration: none;
            font-size: 20px;
        }
        
        .back-button:active {
            background: rgba(0, 122, 255, 0.2);
            transform: scale(0.92);
        }
        
        .header-content {
            flex: 1;
            margin: 0 10px;
        }
        
        .surah-arabic-name {
            font-family: 'SF Pro Arabic', 'Scheherazade', serif;
            font-size: 24px;
            color: #000;
            direction: rtl;
            text-align: center;
            margin-bottom: 2px;
            cursor: pointer;
            user-select: none;
            transition: opacity 0.2s, text-shadow 0.2s;
        }
        
        .surah-arabic-name.playing-surah {
            opacity: 0.7;
            text-shadow: 0 0 4px rgba(0, 122, 255, 0.5);
            animation: gentlePulse 1s ease-in-out infinite;
        }
        
        @keyframes gentlePulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; text-shadow: 0 0 8px rgba(0, 122, 255, 0.8); }
        }
        
        .surah-arabic-name:active {
            transform: scale(0.98);
        }
        
        .surah-info {
            font-size: 14px;
            color: #666;
            text-align: center;
        }
        
        .surah-content {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 16px 8px;
        }
        
        .basmala-container {
            margin-bottom: 16px;
            display: flex;
            justify-content: flex-end;
            width: 100%;
        }
        
        .ayahs-container {
            width: 100%;
        }
        
        .ayah {
            display: flex;
            justify-content: flex-end;
            padding: 0;
            background: transparent;
            border: none;
            margin-bottom: 8px;
            cursor: pointer;
            width: 100%;
        }
        
        .ayah img {
            height: 60px;
            width: auto;
            max-width: 100%;
            display: block;
            border-radius: 12px;
            transition: all 0.15s;
        }
        
        .basmala {
            display: flex;
            justify-content: flex-end;
            padding: 0;
            background: transparent;
            border: none;
            margin: 0;
            cursor: pointer;
            width: 100%;
        }
        
        .basmala img {
            height: 60px;
            width: auto;
            max-width: 100%;
            display: block;
            border-radius: 12px;
            transition: all 0.15s;
        }
        
        .ayah.playing img, .basmala.playing img {
            background: rgba(0, 122, 255, 0.1);
            border: 1px solid rgba(0, 122, 255, 0.3);
            border-radius: 12px;
        }
        
        /* Компактный блок записи - только две кнопки */
        .recording-bar {
            display: flex;
            gap: 12px;
            padding: 12px 16px;
            background: white;
            border-top: 0.5px solid rgba(0, 0, 0, 0.1);
            border-bottom: 0.5px solid rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
        }
        
        .record-btn, .playback-btn {
            flex: 1;
            padding: 12px 0;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all 0.15s;
        }
        
        .record-btn {
            background: #007aff;
            color: white;
        }
        
        .record-btn:active {
            background: #0056cc;
            transform: scale(0.97);
        }
        
        .record-btn.recording {
            background: #ff3b30;
        }
        
        .playback-btn {
            background: #f2f2f7;
            color: #007aff;
            border: 1px solid rgba(0, 122, 255, 0.3);
        }
        
        .playback-btn:active {
            background: #e5e5ea;
            transform: scale(0.97);
        }
        
        .playback-btn:disabled {
            opacity: 0.4;
            transform: none;
            pointer-events: none;
        }
        
        .navigation {
            display: flex;
            justify-content: space-between;
            padding: 12px 16px;
            background: white;
            border-top: 0.5px solid rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
        }
        
        .nav-button {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border-radius: 12px;
            background: #f2f2f7;
            color: #000;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
        }
        
        .nav-button:active {
            background: #e5e5ea;
            transform: scale(0.97);
        }
        
        .nav-button.disabled {
            opacity: 0.3;
            pointer-events: none;
        }
        
        @media (max-width: 375px) {
            .surah-arabic-name {
                font-size: 22px;
            }
            
            .surah-info {
                font-size: 13px;
            }
            
            .ayah img, .basmala img {
                height: 55px;
            }
            
            .record-btn, .playback-btn {
                padding: 10px 0;
                font-size: 15px;
            }
            
            .nav-button {
                padding: 8px 14px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="surahs.html" class="back-button">‹</a>
            <div class="header-content" id="headerContent"></div>
            <div style="width: 44px;"></div>
        </div>
        
        <div class="surah-content" id="surahContent"></div>
        
        <!-- Компактный блок записи - только 2 кнопки -->
        <div class="recording-bar">
            <button class="record-btn" id="recordButton">🎤 Записать</button>
            <button class="playback-btn" id="playbackButton" disabled>▶ Воспроизвести</button>
        </div>
        
        <div class="navigation">
            <a href="#" class="nav-button" id="prevButton">← Предыдущая</a>
            <a href="surahs.html" class="nav-button">Список</a>
            <a href="#" class="nav-button" id="nextButton">Следующая →</a>
        </div>
    </div>

    <script>
        // Данные всех сур
        const surahsData = {
            1: {

                name: "Аль-Фатиха",

                basmalaAudio: "1_basmala.mp3",
                ayahs: [
                    { number: 1, text: "الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ", audio: "1_1.mp3" },
                    { number: 2, text: "الرَّحْمَـٰنِ الرَّحِيمِ", audio: "1_2.mp3" },
                    { number: 3, text: "مَالِكِ يَوْمِ الدِّينِ", audio: "1_3.mp3" },

                    { number: 5, text: "اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ", audio: "1_5.mp3" },
                    { number: 6, text: "صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ", audio: "1_6.mp3" },
                    { number: 7, text: "", audio: "1_7.mp3" }
                ]
            },
            86: { id: 86, number: 86, name: "Ат-Тарик", arabicName: "الطَّارِقِ", basmalaAudio: "86_basmala.mp3", ayahs: Array.from({length: 17}, (_, i) => ({ number: i+1, audio: `86_${i+1}.mp3` })) },
            87: { id: 87, number: 87, name: "Аль-А'ля", arabicName: "الْأَعْلَى", basmalaAudio: "87_basmala.mp3", ayahs: Array.from({length: 19}, (_, i) => ({ number: i+1, audio: `87_${i+1}.mp3` })) },
            88: { id: 88, number: 88, name: "Аль-Гашия", arabicName: "الْغَاشِيَةِ", basmalaAudio: "88_basmala.mp3", ayahs: Array.from({length: 26}, (_, i) => ({ number: i+1, audio: `88_${i+1}.mp3` })) },
            89: { id: 89, number: 89, name: "Аль-Фаджр", arabicName: "الْفَجْرِ", basmalaAudio: "89_basmala.mp3", ayahs: Array.from({length: 30}, (_, i) => ({ number: i+1, audio: `89_${i+1}.mp3` })) },
            90: { id: 90, number: 90, name: "Аль-Балад", arabicName: "الْبَلَدِ", basmalaAudio: "90_basmala.mp3", ayahs: Array.from({length: 20}, (_, i) => ({ number: i+1, audio: `90_${i+1}.mp3` })) },
            91: { id: 91, number: 91, name: "Аш-Шамс", arabicName: "الشَّمْسِ", basmalaAudio: "91_basmala.mp3", ayahs: Array.from({length: 15}, (_, i) => ({ number: i+1, audio: `91_${i+1}.mp3` })) },
            92: { id: 92, number: 92, name: "Аль-Лайл", arabicName: "اللَّيْلِ", basmalaAudio: "92_basmala.mp3", ayahs: Array.from({length: 21}, (_, i) => ({ number: i+1, audio: `92_${i+1}.mp3` })) },
            93: { id: 93, number: 93, name: "Ад-Духа", arabicName: "الضُّحَىٰ", basmalaAudio: "93_basmala.mp3", ayahs: Array.from({length: 11}, (_, i) => ({ number: i+1, audio: `93_${i+1}.mp3` })) },
            94: { id: 94, number: 94, name: "Аш-Шарх", arabicName: "الشَّرْحِ", basmalaAudio: "94_basmala.mp3", ayahs: Array.from({length: 8}, (_, i) => ({ number: i+1, audio: `94_${i+1}.mp3` })) },
            95: { id: 95, number: 95, name: "Ат-Тин", arabicName: "التِّينِ", basmalaAudio: "95_basmala.mp3", ayahs: Array.from({length: 8}, (_, i) => ({ number: i+1, audio: `95_${i+1}.mp3` })) },
            96: { id: 96, number: 96, name: "Аль-Алак", arabicName: "الْعَلَقِ", basmalaAudio: "96_basmala.mp3", ayahs: Array.from({length: 19}, (_, i) => ({ number: i+1, audio: `96_${i+1}.mp3` })) },
            97: { id: 97, number: 97, name: "Аль-Кадр", arabicName: "الْقَدْرِ", basmalaAudio: "97_basmala.mp3", ayahs: Array.from({length: 5}, (_, i) => ({ number: i+1, audio: `97_${i+1}.mp3` })) },
            98: { id: 98, number: 98, name: "Аль-Баййина", arabicName: "الْبَيِّنَةِ", basmalaAudio: "98_basmala.mp3", ayahs: Array.from({length: 8}, (_, i) => ({ number: i+1, audio: `98_${i+1}.mp3` })) },
            99: { id: 99, number: 99, name: "Аз-Зальзаля", arabicName: "الزَّلْزَلَةِ", basmalaAudio: "99_basmala.mp3", ayahs: Array.from({length: 8}, (_, i) => ({ number: i+1, audio: `99_${i+1}.mp3` })) },
            100: { id: 100, number: 100, name: "Аль-Адия́т", arabicName: "الْعَادِيَاتِ", basmalaAudio: "100_basmala.mp3", ayahs: Array.from({length: 11}, (_, i) => ({ number: i+1, audio: `100_${i+1}.mp3` })) },
            101: { id: 101, number: 101, name: "Аль-Кариа", arabicName: "الْقَارِعَةِ", basmalaAudio: "101_basmala.mp3", ayahs: Array.from({length: 11}, (_, i) => ({ number: i+1, audio: `101_${i+1}.mp3` })) },
            102: { id: 102, number: 102, name: "Ат-Такасур", arabicName: "التَّكَاثُرِ", basmalaAudio: "102_basmala.mp3", ayahs: Array.from({length: 8}, (_, i) => ({ number: i+1, audio: `102_${i+1}.mp3` })) },
            103: { id: 103, number: 103, name: "Аль-Аср", arabicName: "الْعَصْرِ", basmalaAudio: "103_basmala.mp3", ayahs: Array.from({length: 3}, (_, i) => ({ number: i+1, audio: `103_${i+1}.mp3` })) },
            104: { id: 104, number: 104, name: "Аль-Хумаза", arabicName: "الْهُمَزَةِ", basmalaAudio: "104_basmala.mp3", ayahs: Array.from({length: 9}, (_, i) => ({ number: i+1, audio: `104_${i+1}.mp3` })) },
            105: { id: 105, number: 105, name: "Аль-Филь", arabicName: "الْفِيلِ", basmalaAudio: "105_basmala.mp3", ayahs: Array.from({length: 5}, (_, i) => ({ number: i+1, audio: `105_${i+1}.mp3` })) },
            106: { id: 106, number: 106, name: "Курайш", arabicName: "قُرَيْشٍ", basmalaAudio: "106_basmala.mp3", ayahs: Array.from({length: 4}, (_, i) => ({ number: i+1, audio: `106_${i+1}.mp3` })) },
            107: { id: 107, number: 107, name: "Аль-Ма'ун", arabicName: "الْمَاعُونَ", basmalaAudio: "107_basmala.mp3", ayahs: Array.from({length: 7}, (_, i) => ({ number: i+1, audio: `107_${i+1}.mp3` })) },
            108: { id: 108, number: 108, name: "Аль-Каусар", arabicName: "الْكَوْثَرِ", basmalaAudio: "108_basmala.mp3", ayahs: Array.from({length: 3}, (_, i) => ({ number: i+1, audio: `108_${i+1}.mp3` })) },
            109: { id: 109, number: 109, name: "Аль-Кафирун", arabicName: "الْكَافِرُونَ", basmalaAudio: "109_basmala.mp3", ayahs: Array.from({length: 6}, (_, i) => ({ number: i+1, audio: `109_${i+1}.mp3` })) },
            110: { id: 110, number: 110, name: "Ан-Наср", arabicName: "النَّصْرِ", basmalaAudio: "110_basmala.mp3", ayahs: Array.from({length: 3}, (_, i) => ({ number: i+1, audio: `110_${i+1}.mp3` })) },
            111: { id: 111, number: 111, name: "Аль-Масад", arabicName: "الْمَسَدِ", basmalaAudio: "111_basmala.mp3", ayahs: Array.from({length: 5}, (_, i) => ({ number: i+1, audio: `111_${i+1}.mp3` })) },
            112: { id: 112, number: 112, name: "Аль-Ихлас", arabicName: "الْإِخْلَاصِ", basmalaAudio: "112_basmala.mp3", ayahs: Array.from({length: 4}, (_, i) => ({ number: i+1, audio: `112_${i+1}.mp3` })) },
            113: { id: 113, number: 113, name: "Аль-Фалак", arabicName: "الْفَلَقِ", basmalaAudio: "113_basmala.mp3", ayahs: Array.from({length: 5}, (_, i) => ({ number: i+1, audio: `113_${i+1}.mp3` })) },
            114: { id: 114, number: 114, name: "Ан-Нас", arabicName: "النَّاسِ", basmalaAudio: "114_basmala.mp3", ayahs: Array.from({length: 6}, (_, i) => ({ number: i+1, audio: `114_${i+1}.mp3` })) }
        };

        const navigationOrder = [1, 86, 87, 88, 89, 90, 91, 92, 93, 94, 95, 96, 97, 98, 99, 100, 101, 102, 103, 104, 105, 106, 107, 108, 109, 110, 111, 112, 113, 114];

        let currentSurahId = 114;
        let currentAudio = null;
        let currentPlayingElement = null;
        
        // Переменные для записи
        let mediaRecorder = null;
        let audioChunks = [];
        let recordedBlob = null;
        let isRecording = false;
        let recordedAudio = null;
        let mediaStream = null;
        
        // Переменные для воспроизведения всей суры
        let fullSurahPlaying = false;
        let fullSurahQueue = [];
        let currentQueueIndex = 0;

        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const idFromUrl = parseInt(urlParams.get('id'));
            
            if (idFromUrl && surahsData[idFromUrl]) {
                currentSurahId = idFromUrl;
            }
            
            loadSurah(currentSurahId);
            setupNavigation();
            setupRecording();
        });

        function loadSurah(surahId) {
            const surah = surahsData[surahId];
            if (!surah) {
                window.location.href = 'surahs.html';
                return;
            }
            
            // Останавливаем воспроизведение всей суры если было
            stopFullSurah();
            
            document.title = `Сура ${surah.number} • ${surah.name}`;
            
            const headerContent = document.getElementById('headerContent');
            headerContent.innerHTML = `
                <div class="surah-arabic-name" id="surahArabicName">${surah.arabicName}</div>
                <div class="surah-info">Сура ${surah.number} • ${surah.name} • ${surah.ayahs.length} аятов</div>
            `;
            
            // Добавляем обработчик для пасхалки
            const arabicNameElement = document.getElementById('surahArabicName');
            arabicNameElement.addEventListener('click', toggleFullSurah);
            
            const content = document.getElementById('surahContent');
            content.innerHTML = '';
            
            const basmalaContainer = document.createElement('div');
            basmalaContainer.className = 'basmala-container';
            basmalaContainer.innerHTML = `
                <div class="basmala" id="basmalaElement">
                    <img src="../assets/images/surahs/${surahId}/basmala.png" alt="Басмала" loading="lazy">
                </div>
            `;
            content.appendChild(basmalaContainer);
            
            const ayahsContainer = document.createElement('div');
            ayahsContainer.className = 'ayahs-container';
            ayahsContainer.id = 'ayahsContainer';
            
            surah.ayahs.forEach((ayah, index) => {
                const ayahElement = document.createElement('div');
                ayahElement.className = 'ayah';
                ayahElement.dataset.ayahNumber = ayah.number;
                ayahElement.dataset.audioFile = ayah.audio;
                ayahElement.dataset.ayahIndex = index;
                ayahElement.innerHTML = `<img src="../assets/images/surahs/${surahId}/${ayah.number}.png" alt="Аят ${ayah.number}" loading="lazy">`;
                ayahElement.addEventListener('click', () => playAudio(ayah.audio, ayahElement));
                ayahsContainer.appendChild(ayahElement);
            });
            
            content.appendChild(ayahsContainer);
            
            const basmalaElement = document.getElementById('basmalaElement');
            basmalaElement.addEventListener('click', () => playAudio(surah.basmalaAudio, basmalaElement));
            
            updateNavigation(surahId);
        }

        function playAudio(audioFile, element) {
            // Если играет вся сура — останавливаем её
            if (fullSurahPlaying) {
                stopFullSurah();
            }
            
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
            
            if (currentPlayingElement) {
                currentPlayingElement.classList.remove('playing');
            }
            
            element.classList.add('playing');
            currentPlayingElement = element;
            
            const audioPath = `../assets/audio/surahs/${audioFile}`;
            currentAudio = new Audio(audioPath);
            
            currentAudio.play().catch(error => {
                console.log('Аудио не найдено:', audioPath);
                element.classList.remove('playing');
                currentPlayingElement = null;
                if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
            });
            
            currentAudio.onended = function() {
                element.classList.remove('playing');
                currentPlayingElement = null;
                currentAudio = null;
            };
            
            if (navigator.vibrate) navigator.vibrate(30);
        }

        // ========== ВОСПРОИЗВЕДЕНИЕ ВСЕЙ СУРЫ (пасхалка) ==========
        function toggleFullSurah() {
            if (fullSurahPlaying) {
                stopFullSurah();
            } else {
                startFullSurah();
            }
        }
        
        function startFullSurah() {
            const surah = surahsData[currentSurahId];
            if (!surah) return;
            
            // Останавливаем текущее одиночное воспроизведение
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;
            }
            
            if (currentPlayingElement) {
                currentPlayingElement.classList.remove('playing');
                currentPlayingElement = null;
            }
            
            // Создаём очередь: басмала + все аяты
            fullSurahQueue = [];
            
            // Добавляем басмалу
            const basmalaElement = document.getElementById('basmalaElement');
            if (basmalaElement) {
                fullSurahQueue.push({
                    type: 'basmala',
                    audioFile: surah.basmalaAudio,
                    element: basmalaElement
                });
            }
            
            // Добавляем все аяты
            const ayahsContainer = document.getElementById('ayahsContainer');
            if (ayahsContainer) {
                const ayahElements = ayahsContainer.querySelectorAll('.ayah');
                ayahElements.forEach((element, index) => {
                    const audioFile = surah.ayahs[index]?.audio;
                    if (audioFile) {
                        fullSurahQueue.push({
                            type: 'ayah',
                            audioFile: audioFile,
                            element: element,
                            ayahNumber: index + 1
                        });
                    }
                });
            }
            
            if (fullSurahQueue.length === 0) return;
            
            fullSurahPlaying = true;
            currentQueueIndex = 0;
            
            // Добавляем визуальный эффект на арабское название
            const arabicNameElement = document.getElementById('surahArabicName');
            if (arabicNameElement) {
                arabicNameElement.classList.add('playing-surah');
            }
            
            // Начинаем воспроизведение с первого элемента
            playNextInQueue();
        }
        
        function playNextInQueue() {
            if (!fullSurahPlaying || currentQueueIndex >= fullSurahQueue.length) {
                // Очередь закончилась
                stopFullSurah();
                return;
            }
            
            const item = fullSurahQueue[currentQueueIndex];
            
            // Подсвечиваем текущий элемент
            if (currentPlayingElement) {
                currentPlayingElement.classList.remove('playing');
            }
            if (item.element) {
                item.element.classList.add('playing');
                currentPlayingElement = item.element;
            }
            
            const audioPath = `../assets/audio/surahs/${item.audioFile}`;
            currentAudio = new Audio(audioPath);
            
            currentAudio.play().catch(error => {
                console.log('Аудио не найдено:', audioPath);
                // Переходим к следующему даже при ошибке
                currentQueueIndex++;
                playNextInQueue();
            });
            
            currentAudio.onended = () => {
                currentQueueIndex++;
                playNextInQueue();
            };
        }
        
        function stopFullSurah() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;
            }
            
            if (currentPlayingElement) {
                currentPlayingElement.classList.remove('playing');
                currentPlayingElement = null;
            }
            
            fullSurahPlaying = false;
            fullSurahQueue = [];
            currentQueueIndex = 0;
            
            // Убираем визуальный эффект
            const arabicNameElement = document.getElementById('surahArabicName');
            if (arabicNameElement) {
                arabicNameElement.classList.remove('playing-surah');
            }
        }

        function setupNavigation() {
            document.getElementById('prevButton').addEventListener('click', function(e) {
                e.preventDefault();
                navigateToSurah(getPrevSurahId(currentSurahId));
            });
            
            document.getElementById('nextButton').addEventListener('click', function(e) {
                e.preventDefault();
                navigateToSurah(getNextSurahId(currentSurahId));
            });
        }

        function getPrevSurahId(currentId) {
            const currentIndex = navigationOrder.indexOf(currentId);
            if (currentIndex === -1) return navigationOrder[0];
            const prevIndex = currentIndex === 0 ? navigationOrder.length - 1 : currentIndex - 1;
            return navigationOrder[prevIndex];
        }

        function getNextSurahId(currentId) {
            const currentIndex = navigationOrder.indexOf(currentId);
            if (currentIndex === -1) return navigationOrder[0];
            const nextIndex = currentIndex === navigationOrder.length - 1 ? 0 : currentIndex + 1;
            return navigationOrder[nextIndex];
        }

        function navigateToSurah(surahId) {
            if (!surahId) return;
            
            // Останавливаем всё воспроизведение
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;
            }
            
            if (currentPlayingElement) {
                currentPlayingElement.classList.remove('playing');
                currentPlayingElement = null;
            }
            
            stopFullSurah();
            
            currentSurahId = surahId;
            window.history.pushState({}, '', `?id=${surahId}`);
            loadSurah(surahId);
            document.getElementById('surahContent').scrollTop = 0;
        }

        function updateNavigation(surahId) {
            const prevButton = document.getElementById('prevButton');
            const nextButton = document.getElementById('nextButton');
            
            const prevId = getPrevSurahId(surahId);
            const nextId = getNextSurahId(surahId);
            
            if (prevId) {
                prevButton.classList.remove('disabled');
                prevButton.href = `?id=${prevId}`;
                const prevSurah = surahsData[prevId];
                prevButton.textContent = `← ${prevSurah ? prevSurah.number : ''}`;
            } else {
                prevButton.classList.add('disabled');
                prevButton.href = '#';
                prevButton.textContent = '←';
            }
            
            if (nextId) {
                nextButton.classList.remove('disabled');
                nextButton.href = `?id=${nextId}`;
                const nextSurah = surahsData[nextId];
                nextButton.textContent = `${nextSurah ? nextSurah.number : ''} →`;
            } else {
                nextButton.classList.add('disabled');
                nextButton.href = '#';
                nextButton.textContent = '→';
            }
        }

        window.addEventListener('popstate', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const idFromUrl = parseInt(urlParams.get('id'));
            
            if (idFromUrl && surahsData[idFromUrl] && idFromUrl !== currentSurahId) {
                currentSurahId = idFromUrl;
                loadSurah(currentSurahId);
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.currentTime = 0;
                    currentAudio = null;
                }
                if (currentPlayingElement) {
                    currentPlayingElement.classList.remove('playing');
                    currentPlayingElement = null;
                }
                stopFullSurah();
            }
        });

        // ========== ЗАПИСЬ ГОЛОСА ==========
        function setupRecording() {
            const recordBtn = document.getElementById('recordButton');
            const playbackBtn = document.getElementById('playbackButton');
            
            recordBtn.addEventListener('click', async () => {
                if (isRecording) {
                    stopRecording();
                } else {
                    await startRecording();
                }
            });
            
            playbackBtn.addEventListener('click', () => {
                if (recordedBlob) {
                    if (recordedAudio) {
                        recordedAudio.pause();
                        recordedAudio.currentTime = 0;
                    }
                    const audioUrl = URL.createObjectURL(recordedBlob);
                    recordedAudio = new Audio(audioUrl);
                    recordedAudio.play();
                    playbackBtn.textContent = '⏸ Стоп';
                    recordedAudio.onended = () => {
                        playbackBtn.textContent = '▶ Воспроизвести';
                        URL.revokeObjectURL(audioUrl);
                    };
                    recordedAudio.onpause = () => {
                        playbackBtn.textContent = '▶ Воспроизвести';
                    };
                }
            });
        }
        
        async function startRecording() {
            const recordBtn = document.getElementById('recordButton');
            const playbackBtn = document.getElementById('playbackButton');
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaStream = stream;
                
                let mimeType = '';
                const mimeTypes = ['audio/webm', 'audio/mp4', 'audio/mpeg'];
                for (const type of mimeTypes) {
                    if (MediaRecorder.isTypeSupported(type)) {
                        mimeType = type;
                        break;
                    }
                }
                
                try {
                    mediaRecorder = new MediaRecorder(stream, { mimeType: mimeType });
                } catch (e) {
                    mediaRecorder = new MediaRecorder(stream);
                }
                
                audioChunks = [];
                
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data && event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };
                
                mediaRecorder.onstop = () => {
                    if (mediaStream) {
                        mediaStream.getTracks().forEach(track => track.stop());
                        mediaStream = null;
                    }
                    recordedBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    playbackBtn.disabled = false;
                    isRecording = false;
                    recordBtn.textContent = '🎤 Записать';
                    recordBtn.classList.remove('recording');
                    if (navigator.vibrate) navigator.vibrate(50);
                };
                
                mediaRecorder.start();
                isRecording = true;
                recordBtn.textContent = '⏹ Остановить';
                recordBtn.classList.add('recording');
                if (navigator.vibrate) navigator.vibrate(30);
                
            } catch (error) {
                console.error('Ошибка микрофона:', error);
                recordBtn.textContent = '🎤 Ошибка';
                setTimeout(() => {
                    recordBtn.textContent = '🎤 Записать';
                }, 2000);
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            }
        }
        
        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
            }
        }
    </script>
</body>
</html>
