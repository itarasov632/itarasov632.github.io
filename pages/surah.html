<!DOCTYPE html>
<html lang="ru" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>Сура</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f2f2f7;
            height: 100vh;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        
        .container {
            height: 100%;
            display: flex;
            flex-direction: column;
            background: white;
        }
        
        .header {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 0.5px solid rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }
        
        .back-button {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: rgba(0, 122, 255, 0.1);
            color: #007aff;
            text-decoration: none;
            font-size: 20px;
        }
        
        .header-content {
            flex: 1;
            margin: 0 10px;
        }
        
        .surah-arabic-name {
            font-family: 'SF Pro Arabic', 'Scheherazade', serif;
            font-size: 24px;
            color: #000;
            direction: rtl;
            text-align: center;
            margin-bottom: 2px;
        }
        
        .surah-info {
            font-size: 14px;
            color: #666;
            text-align: center;
        }
        
        .surah-content {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 2px;
        }
        
        .ayahs-container {
            direction: rtl;
            text-align: right;
        }
        
        .ayah {
            font-family: 'SF Pro Arabic', 'Scheherazade', serif;
            font-size: 26px;
            line-height: 1.8;
            color: #000;
            margin-bottom: 16px;
            padding: 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.15s;
            position: relative;
        }
        
        .ayah:active {
            background: #f2f2f7;
        }
        
        .ayah.playing {
            background: rgba(0, 122, 255, 0.1);
            color: #007aff;
        }
        
        .navigation {
            display: flex;
            justify-content: space-between;
            padding: 16px 20px;
            background: white;
            border-top: 0.5px solid rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
        }
        
        .nav-button {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: 12px;
            background: #f2f2f7;
            color: #000;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
        }
        
        .nav-button:active {
            background: #e5e5ea;
        }
        
        .nav-button.disabled {
            opacity: 0.3;
            pointer-events: none;
        }
        
        @media (max-width: 375px) {
            .surah-arabic-name {
                font-size: 22px;
            }
            
            .surah-info {
                font-size: 13px;
            }
            
            .ayah {
                font-size: 24px;
                line-height: 1.6;
            }
        }
        
        @media (max-height: 700px) {
            .ayah {
                font-size: 22px;
                line-height: 1.5;
                margin-bottom: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="surahs.html" class="back-button">‹</a>
            <div class="header-content" id="headerContent">
                <!-- Сюда будет загружена информация о суре -->
            </div>
            <div style="width: 44px;"></div>
        </div>
        
        <div class="surah-content" id="surahContent">
            <!-- Аяты будут загружены через JS -->
        </div>
        
        <div class="navigation">
            <a href="#" class="nav-button" id="prevButton">← Предыдущая</a>
            <a href="surahs.html" class="nav-button">Список</a>
            <a href="#" class="nav-button" id="nextButton">Следующая →</a>
        </div>
    </div>

    <script>
        // Данные сур (пока только 114)
        const surahsData = {
            114: {
                id: 114,
                number: 114,
                name: "Ан-нас",
                arabicName: "الناس",
                ayahs: [
                    { 
                        number: 1, 
                        text: "بِسْمِ اللّهِ الرَّحْمنِ الرَّحِيمِ",
                        audio: "114_1.mp3"
                    },
                    { 
                        number: 2, 
                        text: "قُلْ أَعُوذُ بِرَبِّ النَّاسِ",
                        audio: "114_2.mp3"
                    },
                    { 
                        number: 3, 
                        text: "مَلِكِ النَّاسِ",
                        audio: "114_3.mp3"
                    },
                    { 
                        number: 4, 
                        text: "إِلَهِ النَّاسِ",
                        audio: "114_4.mp3"
                    },
                    { 
                        number: 5, 
                        text: "مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ",
                        audio: "114_5.mp3"
                    },
                    { 
                        number: 6, 
                        text: "مِنَ الْجِنَّةِ وَ النَّاسِ",
                        audio: "114_6.mp3"
                    }
                ]
            }
        };

        let currentSurahId = 114;
        let currentAudio = null;
        let currentPlayingAyah = null;

        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const idFromUrl = parseInt(urlParams.get('id'));
            
            if (idFromUrl && surahsData[idFromUrl]) {
                currentSurahId = idFromUrl;
            }
            
            loadSurah(currentSurahId);
            setupNavigation();
        });

        function loadSurah(surahId) {
            const surah = surahsData[surahId];
            if (!surah) {
                window.location.href = 'surahs.html';
                return;
            }
            
            document.title = `Сура ${surah.number} • ${surah.name}`;
            
            // Загружаем информацию о суре в шапку
            const headerContent = document.getElementById('headerContent');
            headerContent.innerHTML = `
                <div class="surah-arabic-name">${surah.arabicName}</div>
                <div class="surah-info">Сура ${surah.number} • ${surah.name}</div>
            `;
            
            // Загружаем аяты в основной контент
            const content = document.getElementById('surahContent');
            content.innerHTML = `
                <div class="ayahs-container" id="ayahsContainer">
                    <!-- Аяты будут добавлены через JS -->
                </div>
            `;
            
            const ayahsContainer = document.getElementById('ayahsContainer');
            ayahsContainer.innerHTML = '';
            
            surah.ayahs.forEach(ayah => {
                const ayahElement = document.createElement('div');
                ayahElement.className = 'ayah';
                ayahElement.dataset.ayahNumber = ayah.number;
                ayahElement.dataset.audioFile = ayah.audio;
                ayahElement.textContent = ayah.text;
                
                ayahElement.addEventListener('click', () => playAyah(ayah.number, ayah.audio, ayahElement));
                
                ayahsContainer.appendChild(ayahElement);
            });
            
            updateNavigation(surahId);
        }

        function playAyah(ayahNumber, audioFile, ayahElement) {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
            
            if (currentPlayingAyah) {
                currentPlayingAyah.classList.remove('playing');
            }
            
            ayahElement.classList.add('playing');
            currentPlayingAyah = ayahElement;
            
            const audioPath = `../assets/audio/surahs/${audioFile}`;
            currentAudio = new Audio(audioPath);
            
            currentAudio.play().catch(error => {
                console.log('Аудио не найдено:', audioPath);
                ayahElement.classList.remove('playing');
                
                if (navigator.vibrate) {
                    navigator.vibrate(50);
                }
            });
            
            currentAudio.onended = function() {
                ayahElement.classList.remove('playing');
                currentPlayingAyah = null;
                currentAudio = null;
            };
            
            if (navigator.vibrate) {
                navigator.vibrate(30);
            }
        }

        function setupNavigation() {
            document.getElementById('prevButton').addEventListener('click', function(e) {
                e.preventDefault();
            });
            
            document.getElementById('nextButton').addEventListener('click', function(e) {
                e.preventDefault();
            });
        }

        function updateNavigation(surahId) {
            const prevButton = document.getElementById('prevButton');
            const nextButton = document.getElementById('nextButton');
            
            prevButton.classList.add('disabled');
            nextButton.classList.add('disabled');
            prevButton.href = '#';
            nextButton.href = '#';
        }

        window.addEventListener('popstate', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const idFromUrl = parseInt(urlParams.get('id'));
            
            if (idFromUrl && surahsData[idFromUrl] && idFromUrl !== currentSurahId) {
                currentSurahId = idFromUrl;
                loadSurah(currentSurahId);
                
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.currentTime = 0;
                    currentAudio = null;
                }
                
                if (currentPlayingAyah) {
                    currentPlayingAyah.classList.remove('playing');
                    currentPlayingAyah = null;
                }
            }
        });
    </script>
</body>
</html>
