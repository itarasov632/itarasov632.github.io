<!DOCTYPE html>
<html lang="ru" dir="ltr">
<head>
    <meta charset="UTF-8">

    <title>Сура</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f2f2f7;
            height: 100vh;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        
        .container {
            height: 100%;
            display: flex;
            flex-direction: column;
            background: white;
        }
        
        .header {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 0.5px solid rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }
        
        .back-button {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: rgba(0, 122, 255, 0.1);
            color: #007aff;
            text-decoration: none;
            font-size: 20px;
        }
        
        .header-content {
            flex: 1;
            margin: 0 10px;
        }
        
        .surah-arabic-name {
            font-family: 'SF Pro Arabic', 'Scheherazade', serif;
            font-size: 24px;
            color: #000;
            direction: rtl;
            text-align: center;
            margin-bottom: 2px;
        }
        
        .surah-info {
            font-size: 14px;
            color: #666;
            text-align: center;
        }
        
        .surah-content {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 16px 8px;
        }
        
        .basmala-container {
            margin-bottom: 24px;
        }
        
        .basmala {
            font-family: 'SF Pro Arabic', 'Scheherazade', serif;
            font-size: 26px;
            line-height: 1.8;
            color: #8e8e93;
            text-align: center;
            padding: 20px 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.15s;
            direction: rtl;
            font-weight: 500;
            background: #f8f9fa;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
        
        .basmala:active {
            background: #f2f2f7;
        }
        
        .basmala.playing {
            background: rgba(0, 122, 255, 0.08);
            color: #007aff;
            border-color: rgba(0, 122, 255, 0.2);
        }
        
        .ayahs-container {
            direction: rtl;
        }
        
        .ayah {
            font-family: 'SF Pro Arabic', 'Scheherazade', serif;
            font-size: 26px;
            line-height: 1.8;
            color: #000;
            margin-bottom: 16px;
            padding: 20px 16px 20px 60px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.15s;
            position: relative;
            background: white;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
        
        .ayah:active {
            background: #f2f2f7;
        }
        
        .ayah.playing {
            background: rgba(0, 122, 255, 0.1);
            color: #007aff;
            border-color: rgba(0, 122, 255, 0.2);
        }
                
        .navigation {
            display: flex;
            justify-content: space-between;
            padding: 16px 20px;
            background: white;
            border-top: 0.5px solid rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
        }
        
        .nav-button {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: 12px;
            background: #f2f2f7;
            color: #000;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
        }
        
        .nav-button:active {
            background: #e5e5ea;
        }
        
        .nav-button.disabled {
            opacity: 0.3;
            pointer-events: none;
        }
        
        @media (max-width: 375px) {
            .surah-arabic-name {
                font-size: 22px;
            }
            
            .surah-info {
                font-size: 13px;
            }
            
            .basmala {
                font-size: 24px;
                line-height: 1.6;
                padding: 16px;
            }
            
            .ayah {
                font-size: 24px;
                line-height: 1.6;
                padding: 0;
    		background: transparent;
    		border: none;
    		margin-bottom: 16px;
    		cursor: pointer;
            }


	   .ayah img,
	   .basmala img {
    		width: 100%;
    		height: auto;
    		display: block;
    		border-radius: 12px;
    		border: 1px solid rgba(0, 0, 0, 0.05);
    		transition: all 0.15s;
           }
           

		.ayah.playing img {
    		background: rgba(0, 122, 255, 0.1);
    		border-color: rgba(0, 122, 255, 0.3);
		}

		.basmala {
    		padding: 0;
    		background: transparent;
    		border: none;
    		margin-bottom: 24px;
    		cursor: pointer;
		}

		.basmala.playing img {
    		background: rgba(0, 122, 255, 0.1);
    		border-color: rgba(0, 122, 255, 0.3);

		@media (max-width: 375px) {
		    .ayah {
 	       margin-bottom: 12px;
	    	}
		}

		@media (max-height: 700px) {
    		.ayah {

    		}
		}

                height: 24px;

            .basmala {
                font-size: 22px;

            .ayah {
                font-size: 22px;
                line-height: 1.5;
                margin-bottom: 12px;
                padding: 16px 16px 16px 50px;
            }
        }
    </style>
</head>

                basmala: "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ",
                basmalaAudio: "110_basmala.mp3",
                ayahs: [
                    { number: 1, text: "إِذَا جَاءَ نَصْرُ اللَّهِ وَالْفَتْحُ", audio: "110_1.mp3" },
                    { number: 2, text: "وَرَأَيْتَ النَّاسَ يَدْخُلُونَ فِي دِينِ اللَّهِ أَفْوَاجًا", audio: "110_2.mp3" },
                    { number: 3, text: "فَسَبِّحْ بِحَمْدِ رَبِّكَ وَاسْتَغْفِرْهُ ۚ إِنَّهُ كَانَ تَوَّابًا", audio: "110_3.mp3" }
                ]
            },
            
            111: {
                id: 111,
                number: 111,
                name: "Аль-Масад",
                arabicName: "الْمَسَدِ",
                basmala: "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ",
                basmalaAudio: "111_basmala.mp3",
                ayahs: [
                    { number: 1, text: "تَبَّتْ يَدَا أَبِي لَهَبٍ وَتَبَّ", audio: "111_1.mp3" },
                    { number: 2, text: "مَا أَغْنَىٰ عَنْهُ مَالُهُ وَمَا كَسَبَ", audio: "111_2.mp3" },
                    { number: 3, text: "سَيَصْلَىٰ نَارًا ذَاتَ لَهَبٍ", audio: "111_3.mp3" },
                    { number: 4, text: "وَامْرَأَتُهُ حَمَّالَةَ الْحَطَبِ", audio: "111_4.mp3" },
                    { number: 5, text: "فِي جِيدِهَا حَبْلٌ مِّن مَّسَدٍ", audio: "111_5.mp3" }
                ]
            },
            
            112: {
                id: 112,
                number: 112,
                name: "Аль-Ихлас",
                arabicName: "الْإِخْلَاصِ",
                basmala: "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ",
                basmalaAudio: "112_basmala.mp3",
                ayahs: [
                    { number: 1, text: "قُلْ هُوَ اللَّهُ أَحَدٌ", audio: "112_1.mp3" },
                    { number: 2, text: "اللَّهُ الصَّمَدُ", audio: "112_2.mp3" },
                    { number: 3, text: "لَمْ يَلِدْ وَلَمْ يُولَدْ", audio: "112_3.mp3" },
                    { number: 4, text: "وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ", audio: "112_4.mp3" }
                ]
            },
            
            113: {
                id: 113,
                number: 113,
                name: "Аль-Фалак",
                arabicName: "الْفَلَقِ",
                basmala: "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ",
                basmalaAudio: "113_basmala.mp3",
                ayahs: [
                    { number: 1, text: "قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ", audio: "113_1.mp3" },
                    { number: 2, text: "مِن شَرِّ مَا خَلَقَ", audio: "113_2.mp3" },
                    { number: 3, text: "وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ", audio: "113_3.mp3" },
                    { number: 4, text: "وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ", audio: "113_4.mp3" },
                    { number: 5, text: "وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ", audio: "113_5.mp3" }
                ]
            },
            
            114: {
                id: 114,
                number: 114,
                name: "Ан-Нас",
                arabicName: "النَّاسِ",
                basmala: "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ",
                basmalaAudio: "114_basmala.mp3",
                ayahs: [
                    { number: 1, text: "قُلْ أَعُوذُ بِرَبِّ النَّاسِ", audio: "114_1.mp3" },
                    { number: 2, text: "مَلِكِ النَّاسِ", audio: "114_2.mp3" },
                    { number: 3, text: "إِلَهِ النَّاسِ", audio: "114_3.mp3" },
                    { number: 4, text: "مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ", audio: "114_4.mp3" },
                    { number: 5, text: "الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ", audio: "114_5.mp3" },
                    { number: 6, text: "مِنَ الْجِنَّةِ وَ النَّاسِ", audio: "114_6.mp3" }
                ]
            }
        };

        // Порядок навигации как в surahs.html
        const navigationOrder = [1, 86, 87, 88, 89, 90, 91, 92, 93, 94, 95, 96, 97, 98, 99, 100, 101, 102, 103, 104, 105, 106, 107, 108, 109, 110, 111, 112, 113, 114];

        let currentSurahId = 114;
        let currentAudio = null;
        let currentPlayingElement = null;

        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const idFromUrl = parseInt(urlParams.get('id'));
            
            if (idFromUrl && surahsData[idFromUrl]) {
                currentSurahId = idFromUrl;
            }
            
            loadSurah(currentSurahId);
            setupNavigation();
        });

        function loadSurah(surahId) {
            const surah = surahsData[surahId];
            if (!surah) {
                window.location.href = 'surahs.html';
                return;
            }
            
            document.title = `Сура ${surah.number} • ${surah.name}`;
            
            // Загружаем информацию о суре в шапку
            const headerContent = document.getElementById('headerContent');
            headerContent.innerHTML = `
                <div class="surah-arabic-name">${surah.arabicName}</div>
                <div class="surah-info">Сура ${surah.number} • ${surah.name} • ${surah.ayahs.length} аятов</div>
            `;
            
            // Загружаем басмалу и аяты в основной контент
            const content = document.getElementById('surahContent');
            content.innerHTML = '';
            
            // Создаем контейнер для басмалы
		const basmalaContainer = document.createElement('div');
		basmalaContainer.className = 'basmala-container';
		basmalaContainer.innerHTML = `
		    <div class="basmala" id="basmalaElement">
		        <img src="../assets/images/surahs/${surahId}/basmala.png" 
		             alt="Басмала"
		             loading="lazy">
		    </div>
		`;
            content.appendChild(basmalaContainer);
            
            // Создаем контейнер для аятов
            const ayahsContainer = document.createElement('div');
            ayahsContainer.className = 'ayahs-container';
            ayahsContainer.id = 'ayahsContainer';
            content.appendChild(ayahsContainer);
            
surah.ayahs.forEach(ayah => {
    const ayahElement = document.createElement('div');
    ayahElement.className = 'ayah';
    ayahElement.dataset.ayahNumber = ayah.number;
    ayahElement.dataset.audioFile = ayah.audio;
    
    ayahElement.innerHTML = `
        <img src="../assets/images/surahs/${surahId}/${ayah.number}.png" 
             alt="Аят ${ayah.number}"
             loading="lazy">
    `;
    
    ayahElement.addEventListener('click', () => playAudio(ayah.audio, ayahElement));
    ayahsContainer.appendChild(ayahElement);
});
            
            // Добавляем обработчик клика на басмалу
            const basmalaElement = document.getElementById('basmalaElement');
            basmalaElement.addEventListener('click', () => playAudio(surah.basmalaAudio, basmalaElement));
            
            updateNavigation(surahId);
        }

        function playAudio(audioFile, element) {
            // Останавливаем текущее воспроизведение
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
            
            // Убираем выделение с предыдущего элемента
            if (currentPlayingElement) {
                currentPlayingElement.classList.remove('playing');
            }
            
            // Выделяем текущий элемент
            element.classList.add('playing');
            currentPlayingElement = element;
            
            // Воспроизводим аудио
            const audioPath = `../assets/audio/surahs/${audioFile}`;
            currentAudio = new Audio(audioPath);
            
            currentAudio.play().catch(error => {
                console.log('Аудио не найдено:', audioPath);
                element.classList.remove('playing');
                currentPlayingElement = null;
                
                // Вибрация для уведомления об ошибке
                if (navigator.vibrate) {
                    navigator.vibrate([50, 50, 50]);
                }
            });
            
            // Событие окончания воспроизведения
            currentAudio.onended = function() {
                element.classList.remove('playing');
                currentPlayingElement = null;
                currentAudio = null;
            };
            
            // Легкая вибрация при успешном запуске
            if (navigator.vibrate) {
                navigator.vibrate(30);
            }
        }

        function setupNavigation() {
            document.getElementById('prevButton').addEventListener('click', function(e) {
                e.preventDefault();
                navigateToSurah(getPrevSurahId(currentSurahId));
            });
            
            document.getElementById('nextButton').addEventListener('click', function(e) {
                e.preventDefault();
                navigateToSurah(getNextSurahId(currentSurahId));
            });
        }

        function getPrevSurahId(currentId) {
            const currentIndex = navigationOrder.indexOf(currentId);
            if (currentIndex === -1) return navigationOrder[0]; // Если суры нет в списке
            
            const prevIndex = currentIndex === 0 ? navigationOrder.length - 1 : currentIndex - 1;
            return navigationOrder[prevIndex];
        }

        function getNextSurahId(currentId) {
            const currentIndex = navigationOrder.indexOf(currentId);
            if (currentIndex === -1) return navigationOrder[0]; // Если суры нет в списке
            
            const nextIndex = currentIndex === navigationOrder.length - 1 ? 0 : currentIndex + 1;
            return navigationOrder[nextIndex];
        }

        function navigateToSurah(surahId) {
            if (!surahId) return;
            
            // Останавливаем текущее аудио
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;
            }
            
            if (currentPlayingElement) {
                currentPlayingElement.classList.remove('playing');
                currentPlayingElement = null;
            }
            
            // Обновляем URL и загружаем суру
            currentSurahId = surahId;
            window.history.pushState({}, '', `?id=${surahId}`);
            loadSurah(surahId);
            
            // Прокручиваем к началу
            document.getElementById('surahContent').scrollTop = 0;
        }

        function updateNavigation(surahId) {
            const prevButton = document.getElementById('prevButton');
            const nextButton = document.getElementById('nextButton');
            
            const prevId = getPrevSurahId(surahId);
            const nextId = getNextSurahId(surahId);
            
            // Обновляем кнопку "Предыдущая"
            if (prevId) {
                prevButton.classList.remove('disabled');
                prevButton.href = `?id=${prevId}`;
                const prevSurah = surahsData[prevId];
                if (prevSurah) {
                    prevButton.textContent = `← ${prevSurah.number}`;
                    prevButton.setAttribute('aria-label', `Предыдущая: Сура ${prevSurah.number}. ${prevSurah.name}`);
                }
            } else {
                prevButton.classList.add('disabled');
                prevButton.href = '#';
                prevButton.textContent = '←';
                prevButton.removeAttribute('aria-label');
            }
            
            // Обновляем кнопку "Следующая"
            if (nextId) {
                nextButton.classList.remove('disabled');
                nextButton.href = `?id=${nextId}`;
                const nextSurah = surahsData[nextId];
                if (nextSurah) {
                    nextButton.textContent = `${nextSurah.number} →`;
                    nextButton.setAttribute('aria-label', `Следующая: Сура ${nextSurah.number}. ${nextSurah.name}`);
                }
            } else {
                nextButton.classList.add('disabled');
                nextButton.href = '#';
                nextButton.textContent = '→';
                nextButton.removeAttribute('aria-label');
            }
        }

        // Обработка кнопок браузера "Назад/Вперед"
        window.addEventListener('popstate', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const idFromUrl = parseInt(urlParams.get('id'));
            
            if (idFromUrl && surahsData[idFromUrl] && idFromUrl !== currentSurahId) {
                currentSurahId = idFromUrl;
                loadSurah(currentSurahId);
                
                // Останавливаем воспроизведение при смене страницы
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.currentTime = 0;
                    currentAudio = null;
                }
                
                if (currentPlayingElement) {
                    currentPlayingElement.classList.remove('playing');
                    currentPlayingElement = null;
                }
            }
        });
    </script>
</body>
</html>
