<!DOCTYPE html>
<html lang="ru" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>Буква</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f2f2f7;
            height: 100vh;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        
        .container {
            height: 100%;
            display: flex;
            flex-direction: column;
            background: white;
        }
        
        .header {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 0.5px solid rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
        }
        
        .back-button {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: rgba(0, 122, 255, 0.1);
            color: #007aff;
            text-decoration: none;
            font-size: 20px;
        }
        
        .title {
            font-size: 18px;
            font-weight: 600;
            color: #000;
            text-align: center;
            flex: 1;
            margin: 0 10px;
        }
        
        .content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        
        .letter-top {
            display: flex;
            gap: 16px;
            margin-bottom: 30px;
        }
        
        .makhraj-box {
            width: 25%;
            min-width: 80px;
        }
        
        .makhraj-image {
            width: 100%;
            aspect-ratio: 1;
            background: #e5e5ea;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .makhraj-image.error::after {
            content: "error";
            color: #8e8e93;
            font-size: 14px;
        }
        
        .letter-info {
            flex: 1;
        }
        
        .letter-symbol {
            font-family: 'SF Pro Arabic', 'Scheherazade', serif;
            font-size: 56px;
            margin-bottom: 8px;
            line-height: 1;
        }
        
        .letter-name {
            font-size: 28px;
            font-weight: 600;
            color: #000;
            margin-bottom: 12px;
        }
        
        .play-button {
            width: 50px;
            height: 50px;
            border-radius: 25px;
            background: #007aff;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }
        
        .play-button:active {
            background: #0056cc;
            transform: scale(0.95);
        }
        
        .forms-section {
            margin-bottom: 30px;
        }
        
        .forms-title {
            font-size: 17px;
            font-weight: 600;
            color: #000;
            margin-bottom: 16px;
        }
        
        .forms-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        
        .form-card {
            background: #f8f9fa;
            border-radius: 14px;
            padding: 20px 12px;
            text-align: center;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
        
        .form-label {
            font-size: 15px;
            color: #8e8e93;
            margin-bottom: 12px;
            display: block;
        }
        
        .form-symbol {
            font-family: 'SF Pro Arabic', 'Scheherazade', serif;
            font-size: 32px;
            color: #000;
        }
        
        .navigation {
            display: flex;
            justify-content: space-between;
            padding: 16px 20px;
            background: white;
            border-top: 0.5px solid rgba(0, 0, 0, 0.1);
        }
        
        .nav-button {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: 12px;
            background: #f2f2f7;
            color: #000;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
        }
        
        .nav-button:active {
            background: #e5e5ea;
        }
        
        .nav-button.disabled {
            opacity: 0.3;
            pointer-events: none;
        }
        
        @media (max-width: 375px) {
            .letter-symbol {
                font-size: 48px;
            }
            
            .letter-name {
                font-size: 24px;
            }
            
            .forms-grid {
                gap: 8px;
            }
            
            .form-card {
                padding: 16px 8px;
            }
            
            .form-symbol {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="alphabet.html" class="back-button">‹</a>
            <h1 class="title" id="pageTitle">Буква</h1>
            <div style="width: 44px;"></div>
        </div>
        
        <div class="content">
            <div class="letter-top">
                <div class="makhraj-box">
                    <div class="makhraj-image" id="makhrajImage"></div>
                </div>
                
                <div class="letter-info">
                    <div class="letter-symbol" id="letterSymbol">ا</div>
                    <div class="letter-name" id="letterName">Алиф</div>
                    <button class="play-button" id="playButton">▶</button>
                </div>
            </div>
            
            <section class="forms-section">
                <h3 class="forms-title">Формы написания</h3>
                <div class="forms-grid">
                    <div class="form-card">
                        <span class="form-label">В конце</span>
                        <div class="form-symbol" id="formFinal">ـا</div>
                    </div>
                    <div class="form-card">
                        <span class="form-label">В середине</span>
                        <div class="form-symbol" id="formMedial">ـا</div>
                    </div>
                    <div class="form-card">
                        <span class="form-label">В начале</span>
                        <div class="form-symbol" id="formInitial">ا</div>
                    </div>
                </div>
            </section>
        </div>
        
        <div class="navigation">
            <a href="#" class="nav-button" id="prevButton">← Предыдущая</a>
            <a href="#" class="nav-button" id="nextButton">Следующая →</a>
        </div>
    </div>

    <script>
        const arabicAlphabet = [
            { id: 1, letter: "ا", name: "Алиф" },
            { id: 2, letter: "ب", name: "Ба" },
            { id: 3, letter: "ت", name: "Та" },
            { id: 4, letter: "ث", name: "Са" },
            { id: 5, letter: "ج", name: "Джим" },
            { id: 6, letter: "ح", name: "Ха" },
            { id: 7, letter: "خ", name: "Ха" },
            { id: 8, letter: "د", name: "Даль" },
            { id: 9, letter: "ذ", name: "Заль" },
            { id: 10, letter: "ر", name: "Ра" },
            { id: 11, letter: "ز", name: "За" },
            { id: 12, letter: "س", name: "Син" },
            { id: 13, letter: "ش", name: "Шин" },
            { id: 14, letter: "ص", name: "Сад" },
            { id: 15, letter: "ض", name: "Дад" },
            { id: 16, letter: "ط", name: "Та" },
            { id: 17, letter: "ظ", name: "За" },
            { id: 18, letter: "ع", name: "Айн" },
            { id: 19, letter: "غ", name: "Гайн" },
            { id: 20, letter: "ف", name: "Фа" },
            { id: 21, letter: "ق", name: "Каф" },
            { id: 22, letter: "ك", name: "Каф" },
            { id: 23, letter: "ل", name: "Лям" },
            { id: 24, letter: "م", name: "Мим" },
            { id: 25, letter: "ن", name: "Нун" },
            { id: 26, letter: "ه", name: "Ха" },
            { id: 27, letter: "و", name: "Вав" },
            { id: 28, letter: "ي", name: "Йа" }
        ];

        const letterForms = {
            1: { final: "ـا", medial: "ـا", initial: "ا" },
            2: { final: "ـب", medial: "ـبـ", initial: "بـ" },
            3: { final: "ـت", medial: "ـتـ", initial: "تـ" },
            4: { final: "ـث", medial: "ـثـ", initial: "ثـ" },
            5: { final: "ـج", medial: "ـجـ", initial: "جـ" },
            6: { final: "ـح", medial: "ـحـ", initial: "حـ" },
            7: { final: "ـخ", medial: "ـخـ", initial: "خـ" },
            8: { final: "ـد", medial: "ـد", initial: "د" },
            9: { final: "ـذ", medial: "ـذ", initial: "ذ" },
            10: { final: "ـر", medial: "ـر", initial: "ر" },
            11: { final: "ـز", medial: "ـز", initial: "ز" },
            12: { final: "ـس", medial: "ـسـ", initial: "سـ" },
            13: { final: "ـش", medial: "ـشـ", initial: "شـ" },
            14: { final: "ـص", medial: "ـصـ", initial: "صـ" },
            15: { final: "ـض", medial: "ـضـ", initial: "ضـ" },
            16: { final: "ـط", medial: "ـطـ", initial: "طـ" },
            17: { final: "ـظ", medial: "ـظـ", initial: "ظـ" },
            18: { final: "ـع", medial: "ـعـ", initial: "عـ" },
            19: { final: "ـغ", medial: "ـغـ", initial: "غـ" },
            20: { final: "ـف", medial: "ـفـ", initial: "فـ" },
            21: { final: "ـق", medial: "ـقـ", initial: "قـ" },
            22: { final: "ـك", medial: "ـكـ", initial: "كـ" },
            23: { final: "ـل", medial: "ـلـ", initial: "لـ" },
            24: { final: "ـم", medial: "ـمـ", initial: "مـ" },
            25: { final: "ـن", medial: "ـنـ", initial: "نـ" },
            26: { final: "ـه", medial: "ـهـ", initial: "هـ" },
            27: { final: "ـو", medial: "ـو", initial: "و" },
            28: { final: "ـي", medial: "ـيـ", initial: "يـ" }
        };

        let currentLetterId = 1;
        let currentAudio = null;

        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const idFromUrl = parseInt(urlParams.get('id'));
            
            if (idFromUrl >= 1 && idFromUrl <= 28) {
                currentLetterId = idFromUrl;
            }
            
            loadLetter(currentLetterId);
            setupNavigation();
            setupAudio();
        });

        function loadLetter(letterId) {
            const letter = arabicAlphabet[letterId - 1];
            if (!letter) return;
            
            document.title = `${letter.letter} - ${letter.name}`;
            document.getElementById('pageTitle').textContent = letter.name;
            document.getElementById('letterSymbol').textContent = letter.letter;
            document.getElementById('letterName').textContent = letter.name;
            
            const forms = letterForms[letterId];
            if (forms) {
                document.getElementById('formFinal').textContent = forms.final;
                document.getElementById('formMedial').textContent = forms.medial;
                document.getElementById('formInitial').textContent = forms.initial;
            }
            
            loadMakhrajImage(letterId);
            updateNavigation(letterId);
        }

        function loadMakhrajImage(letterId) {
            const container = document.getElementById('makhrajImage');
            const imageName = letterId.toString().padStart(2, '0');
            const imagePath = `../assets/images/makhraj/${imageName}.png`;
            
            const img = new Image();
            img.onload = function() {
                container.innerHTML = '';
                container.appendChild(img);
                container.classList.remove('error');
            };
            
            img.onerror = function() {
                container.innerHTML = '';
                container.classList.add('error');
                const errorDiv = document.createElement('div');
                errorDiv.textContent = 'error';
                container.appendChild(errorDiv);
            };
            
            img.src = imagePath;
            img.alt = `Махрадж буквы ${letterId}`;
        }

        function setupNavigation() {
            document.getElementById('prevButton').addEventListener('click', function(e) {
                e.preventDefault();
                if (currentLetterId > 1) {
                    currentLetterId--;
                    updateUrlAndLoad();
                }
            });
            
            document.getElementById('nextButton').addEventListener('click', function(e) {
                e.preventDefault();
                if (currentLetterId < 28) {
                    currentLetterId++;
                    updateUrlAndLoad();
                }
            });
        }

        function updateNavigation(letterId) {
            const prevButton = document.getElementById('prevButton');
            const nextButton = document.getElementById('nextButton');
            
            prevButton.classList.toggle('disabled', letterId <= 1);
            nextButton.classList.toggle('disabled', letterId >= 28);
            
            prevButton.href = letterId > 1 ? `?id=${letterId - 1}` : '#';
            nextButton.href = letterId < 28 ? `?id=${letterId + 1}` : '#';
        }

        function updateUrlAndLoad() {
            window.history.pushState({}, '', `?id=${currentLetterId}`);
            loadLetter(currentLetterId);
            
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;
            }
        }

        function setupAudio() {
            document.getElementById('playButton').addEventListener('click', playAudio);
        }

        function playAudio() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
            
            const audioName = currentLetterId.toString().padStart(2, '0');
            const audioPath = `../assets/audio/letters/${audioName}.mp3`;
            
            currentAudio = new Audio(audioPath);
            currentAudio.play().catch(error => {
                console.log('Аудио не найдено');
                if (navigator.vibrate) navigator.vibrate(50);
            });
            
            if (navigator.vibrate) navigator.vibrate(30);
        }

        window.addEventListener('popstate', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const idFromUrl = parseInt(urlParams.get('id'));
            
            if (idFromUrl >= 1 && idFromUrl <= 28 && idFromUrl !== currentLetterId) {
                currentLetterId = idFromUrl;
                loadLetter(currentLetterId);
                
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.currentTime = 0;
                    currentAudio = null;
                }
            }
        });
    </script>
</body>
</html>
