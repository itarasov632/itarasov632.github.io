<!DOCTYPE html>
<html lang="ru" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>Суры</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f2f2f7;
            height: 100vh;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        
        .container {
            height: 100%;
            display: flex;
            flex-direction: column;
            background: white;
        }
        
        .header {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 0.5px solid rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }
        
        .back-button {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: rgba(0, 122, 255, 0.1);
            color: #007aff;
            text-decoration: none;
            font-size: 20px;
        }
        
        .title {
            font-size: 18px;
            font-weight: 600;
            color: #000;
            text-align: center;
            flex: 1;
            margin: 0 10px;
        }
        
        .surahs-list {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 16px;
        }
        
        .surah-item {
            display: flex;
            align-items: center;
            padding: 20px;
            background: white;
            border-radius: 16px;
            margin-bottom: 12px;
            text-decoration: none;
            color: #000;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.05);
            transition: all 0.15s;
        }
        
        .surah-item:active {
            background: #f2f2f7;
            transform: scale(0.98);
        }
        
        .surah-number {
            width: 60px;
            height: 60px;
            background: #007aff;
            color: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 600;
            margin-right: 16px;
            flex-shrink: 0;
        }
        
        .surah-info {
            flex: 1;
            text-align: left;
        }
        
        .surah-name {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        .surah-arabic {
            font-family: 'SF Pro Arabic', 'Scheherazade', serif;
            font-size: 20px;
            color: #666;
            direction: rtl;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="../index.html" class="back-button">‹</a>
            <h1 class="title">Суры</h1>
            <div style="width: 44px;"></div>
        </div>
        
        <div class="surahs-list" id="surahsList"></div>
    </div>

    <script>
        // Единый список сур: 1, 67, 96-114
        const surahsList = [
            { id: 1, number: 1, name: "Аль-Фатиха", arabicName: "الْفَاتِحَةِ", ayahCount: 7 },
            { id: 67, number: 67, name: "Аль-Мульк", arabicName: "الْمُلْكِ", ayahCount: 30 },
            { id: 96, number: 96, name: "Аль-Алак", arabicName: "الْعَلَقِ", ayahCount: 19 },
            { id: 97, number: 97, name: "Аль-Кадр", arabicName: "الْقَدْرِ", ayahCount: 5 },
            { id: 98, number: 98, name: "Аль-Баййина", arabicName: "الْبَيِّنَةِ", ayahCount: 8 },
            { id: 99, number: 99, name: "Аз-Зальзаля", arabicName: "الزَّلْزَلَةِ", ayahCount: 8 },
            { id: 100, number: 100, name: "Аль-Адия́т", arabicName: "الْعَادِيَاتِ", ayahCount: 11 },
            { id: 101, number: 101, name: "Аль-Кариа", arabicName: "الْقَارِعَةِ", ayahCount: 11 },
            { id: 102, number: 102, name: "Ат-Такасур", arabicName: "التَّكَاثُرِ", ayahCount: 8 },
            { id: 103, number: 103, name: "Аль-Аср", arabicName: "الْعَصْرِ", ayahCount: 3 },
            { id: 104, number: 104, name: "Аль-Хумаза", arabicName: "الْهُمَزَةِ", ayahCount: 9 },
            { id: 105, number: 105, name: "Аль-Филь", arabicName: "الْفِيلِ", ayahCount: 5 },
            { id: 106, number: 106, name: "Курайш", arabicName: "قُرَيْشٍ", ayahCount: 4 },
            { id: 107, number: 107, name: "Аль-Ма'ун", arabicName: "الْمَاعُونَ", ayahCount: 7 },
            { id: 108, number: 108, name: "Аль-Каусар", arabicName: "الْكَوْثَرِ", ayahCount: 3 },
            { id: 109, number: 109, name: "Аль-Кафирун", arabicName: "الْكَافِرُونَ", ayahCount: 6 },
            { id: 110, number: 110, name: "Ан-Наср", arabicName: "النَّصْرِ", ayahCount: 3 },
            { id: 111, number: 111, name: "Аль-Масад", arabicName: "الْمَسَدِ", ayahCount: 5 },
            { id: 112, number: 112, name: "Аль-Ихлас", arabicName: "الْإِخْلَاصِ", ayahCount: 4 },
            { id: 113, number: 113, name: "Аль-Фалак", arabicName: "الْفَلَقِ", ayahCount: 5 },
            { id: 114, number: 114, name: "Ан-Нас", arabicName: "النَّاسِ", ayahCount: 6 }
        ];

        document.addEventListener('DOMContentLoaded', function() {
            const container = document.getElementById('surahsList');
            
            surahsList.forEach(surah => {
                const item = document.createElement('a');
                item.className = 'surah-item';
                item.href = `surah.html?id=${surah.id}`;
                item.innerHTML = `
                    <div class="surah-number">${surah.number}</div>
                    <div class="surah-info">
                        <div class="surah-name">${surah.number} • ${surah.name}</div>
                        <div class="surah-arabic">${surah.arabicName}</div>
                    </div>
                `;
                container.appendChild(item);
            });
        });
    </script>
</body>
</html>
