<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- PWA мета-теги -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Заучивание Корана">
    <meta name="theme-color" content="#007aff">
    <meta name="description" content="Приложение для изучения арабского алфавита">
    
    <!-- Иконки для PWA -->
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="manifest" href="manifest.json">
    
    <title>Заучивание Корана</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📖 Заучивание Корана</h1>
        </header>
        
        <main class="main-grid">
            <a href="alphabet.html" class="app-card">
                <div class="card-icon">ا</div>
                <h2>Алфавит</h2>
                <p>28 букв с произношением</p>
            </a>
            
            <a href="#" class="app-card disabled">
                <div class="card-icon">🕋</div>
                <h2>Таджвид</h2>
                <p>Скоро</p>
            </a>
            
            <a href="#" class="app-card disabled">
                <div class="card-icon">⭐</div>
                <h2>Судры</h2>
                <p>Скоро</p>
            </a>
        </main>
        
        <footer>
            <p>Для изучения Священного Корана</p>
            <p class="install-hint" id="installHint" style="display: none;">
                Нажмите 📥 → "На экран «Домой»"
            </p>
        </footer>
    </div>

    <script>
        // Регистрация Service Worker для PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('service-worker.js')
                    .then(registration => {
                        console.log('ServiceWorker зарегистрирован');
                    })
                    .catch(err => {
                        console.log('Ошибка регистрации ServiceWorker:', err);
                    });
            });
        }
        
        // Показать подсказку об установке
        window.addEventListener('beforeinstallprompt', (e) => {
            document.getElementById('installHint').style.display = 'block';
        });
        
        // Подсказка для iOS
        if (navigator.userAgent.includes('iPhone') || navigator.userAgent.includes('iPad')) {
            document.getElementById('installHint').style.display = 'block';
        }
    </script>
</body>
</html>
