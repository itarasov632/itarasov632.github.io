<!DOCTYPE html>
<html lang="ru" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Второй учитель">
    
    <title>Второй учитель</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f2f2f7;
            height: 100vh;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            display: flex;
            flex-direction: column;
        }
        
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 12px;
            max-width: 400px;
            margin: 0 auto;
            width: 100%;
        }
        
        .logo {
            font-size: 48px;
            margin-bottom: 8px;
            text-align: center;
        }
        
        h1 {
            font-size: 24px;
            font-weight: 700;
            color: #000;
            margin-bottom: 4px;
            text-align: center;
        }
        
        .description {
            font-size: 14px;
            color: #666;
            margin-bottom: 16px;
            text-align: center;
        }
        
        .features {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 12px;
        }
        
        .feature-card {
            background: white;
            border-radius: 14px;
            padding: 16px 8px;
            text-decoration: none;
            color: #000;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        
        .feature-card:active {
            transform: scale(0.97);
            background: #f8f9fa;
        }
        
        .feature-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }
        
        .feature-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 2px;
        }
        
        .feature-desc {
            font-size: 11px;
            color: #666;
        }
        
        .install-hint {
            font-size: 12px;
            color: #007aff;
            padding: 8px 12px;
            background: rgba(0, 122, 255, 0.1);
            border-radius: 10px;
            text-align: center;
            margin-top: auto;
            margin-bottom: 8px;
        }
        
        .install-hint.hidden {
            display: none;
        }
        
        footer {
            color: #888;
            font-size: 11px;
            text-align: center;
            padding: 4px 0;
        }
        
        @media (max-height: 700px) {
            .logo { font-size: 40px; }
            h1 { font-size: 22px; }
            .description { font-size: 13px; margin-bottom: 12px; }
            .features { gap: 8px; }
            .feature-card { padding: 12px 6px; }
            .feature-icon { font-size: 28px; }
        }
        
        @media (max-height: 600px) {
            .logo { font-size: 36px; margin-bottom: 4px; }
            h1 { font-size: 20px; }
            .description { font-size: 12px; margin-bottom: 8px; }
            .features { gap: 6px; }
            .install-hint { font-size: 11px; padding: 6px 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">📖</div>
        <h1>Второй учитель</h1>
        <p class="description">Изучение арабского алфавита и сур Корана</p>
        
        <div class="features">
            <a href="pages/alphabet.html" class="feature-card">
                <div class="feature-icon">ا</div>
                <div class="feature-title">Арабский алфавит</div>
                <div class="feature-desc">28 букв с махраджем</div>
            </a>
            
            <a href="pages/tajweed.html" class="feature-card">
                <div class="feature-icon">🕋</div>
                <div class="feature-title">Таджвид</div>
                <div class="feature-desc">В разработке</div>
            </a>
            
            <a href="pages/surahs.html" class="feature-card">
                <div class="feature-icon">⭐</div>
                <div class="feature-title">Краткие суры</div>
                <div class="feature-desc">29 сур</div>
            </a>
            
            <a href="pages/random-setup.html" class="feature-card">
                <div class="feature-icon">🎲</div>
                <div class="feature-title">Случайный аят</div>
                <div class="feature-desc">Тренируй слух</div>
            </a>
        </div>
        
        <div class="install-hint" id="installHint">Добавьте на главный экран</div>
        
        <footer>
            Для изучения Священного Корана
        </footer>
    </div>

    <script>
        (function() {
            // Проверяем, запущено ли приложение как PWA (на главном экране)
            const isInStandaloneMode = () => {
                return window.matchMedia('(display-mode: standalone)').matches ||
                       window.navigator.standalone || // iOS Safari
                       window.matchMedia('(display-mode: fullscreen)').matches ||
                       window.matchMedia('(display-mode: minimal-ui)').matches;
            };
            
            // Проверяем, iOS ли это
            const isIOS = () => {
                return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
            };
            
            // Показываем подсказку только если:
            // 1. Это iOS
            // 2. И приложение НЕ в standalone режиме (не на главном экране)
            const shouldShowHint = isIOS() && !isInStandaloneMode();
            
            const hintElement = document.getElementById('installHint');
            
            if (!shouldShowHint) {
                hintElement.classList.add('hidden');
            }
            
            // Также слушаем изменение режима отображения (на случай, если пользователь добавит во время сессии)
            if (isIOS()) {
                window.matchMedia('(display-mode: standalone)').addListener(function(e) {
                    if (e.matches) {
                        hintElement.classList.add('hidden');
                    }
                });
            }
        })();
    </script>
</body>
</html>
